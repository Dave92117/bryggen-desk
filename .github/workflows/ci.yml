# Runs on every push to main and on every pull request.
# A red X here means something is broken; fix it before building more.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL that lives only while this job runs
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bryggen_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bryggen_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bryggen_desk

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test /api/health
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30 seconds"
          exit 1
