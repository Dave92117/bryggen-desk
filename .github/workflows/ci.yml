# Runs on every push to main and on every pull request.
# A red X here means something is broken; fix it before building more.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL that lives only while this job runs
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bryggen_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bryggen_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bryggen_desk
      # Throwaway values for CI only. The real secret lives in Vercel's settings.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed demo data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test /api/health and demo login
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo ""
              echo "Health check passed"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Health check failed after 30 seconds"
              exit 1
            fi
            sleep 1
          done
          curl -sf -o /dev/null \
            -H "Origin: http://localhost:3000" \
            -H "Content-Type: application/json" \
            -d '{"email":"agent@example.com","password":"Bryggen2026!"}' \
            http://localhost:3000/api/auth/sign-in/email
          echo "Demo login passed"
